name: Build Qahwet El Hetta APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract uploaded project ZIP
        run: |
          mkdir -p bundle
          unzip -q qahwet_elhetta_github_repo_upload.zip -d bundle
          SOURCE_ZIP=$(find bundle -type f -name "qahwa_android_source.zip" -print -quit)
          if [ -z "$SOURCE_ZIP" ]; then
            echo "Android source ZIP was not found."
            exit 1
          fi
          mkdir app-source
          unzip -q "$SOURCE_ZIP" -d app-source

      - name: Inspect extracted application source
        working-directory: app-source
        run: |
          echo "=== SOURCE FILE TREE ==="
          find . -maxdepth 4 -type f ! -path './node_modules/*' ! -path './.git/*' | sort | head -300
          echo "=== PACKAGE.JSON ==="
          if [ -f package.json ]; then cat package.json; fi
          echo "=== HTML ENTRY FILES ==="
          find . -maxdepth 3 -type f -name '*.html' ! -path './node_modules/*' -print
          echo "=== JS/CSS SOURCE FILE SIZES ==="
          find . -maxdepth 4 -type f ! -path "./node_modules/*" | grep -E "\\.(js|mjs|css)$" | sort | head -200 | while IFS= read -r f; do wc -c "$f"; done
          echo "=== MAIN HTML CONTENT (IF PRESENT) ==="
          for f in index.html www/index.html public/index.html; do
            if [ -f "$f" ]; then echo "--- $f ---"; sed -n '1,260p' "$f"; fi
          done

      - name: Upload extracted source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: qahwet-el-hetta-extracted-source
          path: app-source/
          if-no-files-found: error
          retention-days: 3

      - name: Apply background music lifecycle fix
        run: python3 ../scripts/patch-background-music.py
        working-directory: app-source

      - name: Install dependencies
        working-directory: app-source
        run: npm install

      - name: Prepare Android project
        working-directory: app-source
        run: |
          npx cap add android
          npx cap sync android
          unzip -o -q ../android-icons.zip -d android/app/src/main/res/
          cp ../google-services.json android/app/google-services.json
          python3 ../scripts/prepare-android-release.py
        env:
          GOOGLE_SERVICES_JSON: ${{ github.workspace }}/google-services.json

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qahwet-el-hetta-release.jks"
          test -s "$RUNNER_TEMP/qahwet-el-hetta-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/qahwet-el-hetta-release.jks" >> "$GITHUB_ENV"

      - name: Build debug and signed release APKs
        working-directory: app-source/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Upload debug APK (backup)
        uses: actions/upload-artifact@v4
        with:
          name: qahwet-el-hetta-debug-apk
          path: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: qahwet-el-hetta-signed-release-apk
          path: app-source/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
