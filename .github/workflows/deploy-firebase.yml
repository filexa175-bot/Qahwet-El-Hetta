name: Deploy Qahwet El Hetta Firebase backend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/friends-private-rooms
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'functions/**'
      - '.github/workflows/deploy-firebase.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using repository secret
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QAHWET_EL_HETTA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate Cloud Functions syntax
        run: node --check functions/index.js

      - name: Deploy Firestore rules and Cloud Functions
        run: firebase deploy --only firestore:rules,functions --project qahwet-el-hetta --non-interactive
