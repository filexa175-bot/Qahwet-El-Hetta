name: Build Qahwet El Hetta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/accounts-online-multiplayer
      - fix/free-firestore-wallet

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract uploaded project ZIP
        run: |
          mkdir -p bundle
          unzip -q qahwet_elhetta_github_repo_upload.zip -d bundle
          SOURCE_ZIP=$(find bundle -type f -name "qahwa_android_source.zip" -print -quit)
          if [ -z "$SOURCE_ZIP" ]; then
            echo "Android source ZIP was not found."
            exit 1
          fi
          mkdir app-source
          unzip -q "$SOURCE_ZIP" -d app-source

      - name: Validate and apply player profile and home screen update
        working-directory: app-source
        run: |
          python3 -m py_compile ../scripts/patch-player-profile.py
          python3 ../scripts/patch-player-profile.py

      - name: Apply unified visual design pass 106
        working-directory: app-source
        run: |
          python3 -m py_compile ../scripts/patch-design-pass-106.py
          python3 ../scripts/patch-design-pass-106.py
          grep -Fq 'QH DESIGN PASS 106' www/index.html
          grep -Fq 'qh-sign-art' www/index.html
          grep -Fq 'Powered by Filexawy' www/index.html
          grep -Fq 'QH DESIGN PASS 106' www/game.html
          echo "Build 106 visual design markers verified."

      - name: Apply warm café redesign and onboarding navigation fix 107
        working-directory: app-source
        run: |
          python3 -m py_compile ../scripts/patch-design-pass-107.py
          python3 ../scripts/patch-design-pass-107.py
          grep -Fq 'QH DESIGN PASS 107' www/index.html
          grep -Fq 'position:fixed!important' www/index.html
          grep -Fq 'QH DESIGN PASS 107' www/game.html
          grep -Fq 'التالي' ../scripts/player-home-screen.html.txt
          echo "Build 107 warm café identity and onboarding CTA verified."

      - name: Apply editorial layout and natural scrolling redesign 108
        working-directory: app-source
        run: |
          python3 -m py_compile ../scripts/patch-design-pass-108.py
          python3 ../scripts/patch-design-pass-108.py
          grep -Fq 'QH DESIGN PASS 108' www/index.html
          grep -Fq 'position:static!important' www/index.html
          grep -Fq 'QH DESIGN PASS 108' www/game.html
          echo "Build 108 scroll-safe layout and identity separation verified."

      - name: Inspect extracted application source
        working-directory: app-source
        run: |
          echo "=== SOURCE FILE TREE ==="
          find . -maxdepth 4 -type f ! -path './node_modules/*' ! -path './.git/*' | sort | head -300
          echo "=== PACKAGE.JSON ==="
          if [ -f package.json ]; then cat package.json; fi
          echo "=== HTML ENTRY FILES ==="
          find . -maxdepth 3 -type f -name '*.html' ! -path './node_modules/*' -print
          echo "=== JS/CSS SOURCE FILE SIZES ==="
          find . -maxdepth 4 -type f ! -path "./node_modules/*" | grep -E "\\.(js|mjs|css)$" | sort | head -200 | while IFS= read -r f; do wc -c "$f"; done
          echo "=== MAIN HTML CONTENT (IF PRESENT) ==="
          for f in index.html www/index.html public/index.html; do
            if [ -f "$f" ]; then echo "--- $f ---"; sed -n '1,260p' "$f"; fi
          done

      - name: Upload extracted source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: qahwet-el-hetta-extracted-source
          path: app-source/
          if-no-files-found: error
          retention-days: 3

      - name: Apply background music lifecycle fix
        run: python3 ../scripts/patch-background-music.py
        working-directory: app-source

      - name: Add dismissible system messages
        run: python3 ../scripts/patch-dismissible-system-messages.py
        working-directory: app-source

      - name: Install dependencies and bundle Firebase auth
        working-directory: app-source
        run: |
          python3 ../scripts/patch-firebase-auth.py
          npm install
          cp ../firebase-auth-entry.js ./firebase-auth-entry.js
          python3 ../scripts/patch-firebase-auth-diagnostic.py
          npx esbuild ./firebase-auth-entry.js --bundle --platform=browser --format=iife --outfile=www/firebase-auth.js
          echo "=== VERIFY FIREBASE DIAGNOSTIC BUNDLE ==="
          grep -Fq 'QH-DIAG-20261123-C' www/firebase-auth.js
          grep -Fq 'project=' www/firebase-auth.js
          echo "Diagnostic marker confirmed in bundled web asset."

      - name: Prepare Android project
        working-directory: app-source
        run: |
          npx cap add android
          python3 ../scripts/prepare-firebase-native.py
          npx cap sync android
          unzip -o -q ../android-icons.zip -d android/app/src/main/res/
          cp ../google-services.json android/app/google-services.json
          python3 ../scripts/prepare-android-release.py
        env:
          GOOGLE_SERVICES_JSON: ${{ github.workspace }}/google-services.json

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qahwet-el-hetta-release.jks"
          test -s "$RUNNER_TEMP/qahwet-el-hetta-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/qahwet-el-hetta-release.jks" >> "$GITHUB_ENV"

      - name: Build debug and signed release APKs
        working-directory: app-source/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Verify release signing certificate matches Firebase OAuth config
        working-directory: app-source/android
        run: |
          set -euo pipefail
          EXPECTED_SHA1=$(python3 -c "import json; d=json.load(open('../../google-services.json')); c=d['client'][0]['oauth_client']; print(next(x['android_info']['certificate_hash'] for x in c if x.get('client_type') == 1).replace(':','').upper())")
          ACTUAL_SHA1=$(keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | sed -n 's/.*SHA1: //p' | head -n 1 | tr -d ' :' | tr '[:lower:]' '[:upper:]')
          echo "Firebase Android OAuth SHA-1: $EXPECTED_SHA1"
          echo "Release APK signing SHA-1:    $ACTUAL_SHA1"
          test -n "$EXPECTED_SHA1" && test "$EXPECTED_SHA1" = "$ACTUAL_SHA1"
          echo "Release signing certificate matches Firebase OAuth configuration."

      - name: Verify diagnostic marker inside final APKs
        working-directory: app-source/android
        run: |
          set -euo pipefail
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            test -s "$APK"
            ENTRY=$(unzip -Z1 "$APK" | grep -F 'firebase-auth.js' | head -n 1 || true)
            if [ -z "$ENTRY" ]; then
              echo "firebase-auth.js was not found inside $APK"
              exit 1
            fi
            if ! unzip -p "$APK" "$ENTRY" | grep -Fq 'QH-DIAG-20261123-C'; then
              echo "Diagnostic marker is missing from $APK ($ENTRY)"
              exit 1
            fi
            echo "Verified QH-DIAG-20261123-C inside $APK at $ENTRY"
          done

      - name: Upload debug APK (backup)
        uses: actions/upload-artifact@v4
        with:
          name: qahwet-el-hetta-debug-apk
          path: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: qahwet-el-hetta-signed-release-apk
          path: app-source/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
